<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker Survey</title>
    <link rel="stylesheet" href="surveyPage.css">
</head>
<body>
    <div class="split-container">

        <div class="picture"></div>

        <div class="form-part">
            <br>
            <h2>Fill out this form to continue on to the Habit Tracker with your new habits!</h2>
            <br>

            <form id="initial_survey" method = "post" action = "processes/survey.php">

                <!-- choose your character -->
                <h4>Choose your avatar!</h4>
                    <input type="radio" name="character" id="penguin" value="penguin" required>
                        <label for="penguin">Penguin</label><br>

                    <input type="radio" name="character" id="narwhal" value="narwhal">
                        <label for="narwhal">Narwhal</label><br>

        <input type="radio" name="character" id="orangutan" value="orangutan">
            <label for="orangutan">Orangutan</label><br>

        <input type="radio" name="character" id="raccoon" value="raccoon">
            <label for="raccoon">Raccoon</label><br>

        <hr>

        <h3>Name your avatar!</h3>
        <input type="name" id="name" name="name">

                    <br><br>

    <!-- age -->
    <h3>What's your age?</h3>
        <input type="number" id="age" name="age" min="6" max="120">

                <br><br>

                <!-- habit options -->
                <h4>What habit(s) do you want to improve?</h4>

                    <input type="checkbox" name="sleep" id="sleep" value="Sleep">
                        <label for="sleep">Sleep</label><br>

                    <input type="checkbox" name="exercise" id="exercise" value="Exercise">
                        <label for="exercise">Exercise</label><br>

                    <input type="checkbox" name="water" id="water" value="Drinking Water">
                        <label for="water">Drinking Water</label><br>

                    <input type="checkbox" name="screen" id="screen" value="Screen Time">
                        <label for="screen">Screen Time</label>
                    
                    <br><br>
                <!-- submit -->
                    <button type="submit">Submit</button><br>
            </form>
        </div>
    </div>
</body>
</html>
